services:
  postgres:
    image: postgres:16
    container_name: mmudreborn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmudreborn
      POSTGRES_PASSWORD: mmudreborn
      POSTGRES_DB: mmudreborn
    ports:
      # Local only: the password above is a public default, so never publish this on every interface.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmudreborn -d mmudreborn"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mmudreborn-postgres:/var/lib/postgresql/data

volumes:
  mmudreborn-postgres: